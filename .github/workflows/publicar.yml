name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Publica o site na hospedagem própria (cPanel) em honoriaoficial.com.
  # Só roda quando os segredos FTP_SERVER, FTP_USERNAME e FTP_PASSWORD
  # estiverem cadastrados no GitHub (Settings > Secrets and variables > Actions).
  cpanel:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - if: env.FTP_SERVER != ''
        uses: actions/checkout@v4
      - if: env.FTP_SERVER != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.FTP_SERVER != ''
        run: npm ci && npm run build
        env:
          SITE_URL: https://honoriaoficial.com
          BASE_PATH: /
      - if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
